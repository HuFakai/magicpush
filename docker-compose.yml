services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: magicpush-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - server-data:/app/server/data # 数据库文件
      - server-logs:/app/server/logs # 日志文件
    environment:
      - NODE_ENV=production # 可选项,默认production
      - JWT_ACCESS_EXPIRES_IN=15m # 可选项,默认15分钟
      - JWT_REFRESH_EXPIRES_IN=7d # 可选项,默认7天
      - DB_PATH=./data/push_service.db # 可选项,默认./data/push_service.db
      - LOG_LEVEL=info # 可选项,默认info
      - ALLOW_PRIVATE_OUTBOUND_URLS=false # 默认禁止出站访问内网；可信单管理员部署可显式改为 true
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-} # 使用 HTTPS 域名或多层反向代理时填写外部访问地址
      - MISOUND_AUDIO_MAX_SIZE_MB=20 # 小爱音箱上传音频的单文件上限
      - TZ=Asia/Shanghai # 可选项,默认东八区(北京时间),可设置为其他时区如 UTC, America/New_York 等
    networks:
      - magicpush-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: magicpush-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - magicpush-network

networks:
  magicpush-network:
    driver: bridge

volumes:
  server-data:
  server-logs:
